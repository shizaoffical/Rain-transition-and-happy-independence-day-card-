<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding-top: 50px;

        background-color: black;

    }
    .container{
        position: absolute;
            height: 400px;
            background: 400px;
    }
    .cloud{
        position: relative;
        width: 320px;
        height: 100px;
        background-color: white;
        border-radius: 100px;
        top: 70px;
    }
   .cloud::before{
    content: "";
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: white;
    top: -50px;
    left: 40px;
    box-shadow: 90px 0 0 30px white;
   }
   .rain{
    position: relative;
   display: flex;
    z-index: 1;
   }
   .rain span{
    position: absolute;
     width: 10px;
     height: 10px;
     background-color: white;
     margin: 0 2px;
     border-radius: 50%;
     animation: fall 5s linear infinite;
     animation-duration: calc(15s / var(--i) );
     transform-origin: bottom;
   }
   @keyframes fall {
    0%{  
      transform: translateY(0) scale(1);
    }
    70%{
        transform: translateY(300px) scale(1);
    }
    100%{
        transform: translateY(300px) scale(1);
    }
   }
</style>
<body>
     <div class="container">
        <div class="cloud"></div>
        <div class="rain">
            <span style="--i:19"> </span>
            <span style="--i:16"> </span>
            <span style="--i:19"> </span>
            <span style="--i:19"> </span>
            <span style="--i:16"> </span>
            <span style="--i:19"> </span>
            <span style="--i:16"> </span>
            <span style="--i:19"> </span>
            <span style="--i:19"> </span>
            <span style="--i:10"> </span>
            <span style="--i:19"> </span>
            <span style="--i:16"> </span>
            <span style="--i:19"> </span>
            <span style="--i:10"> </span>
            <span style="--i:19"> </span>
            <span style="--i:16"> </span>
            <span style="--i:19"> </span>
            <span style="--i:16"> </span>
            <span style="--i:19"> </span>
            <span style="--i:10"> </span>
            <span style="--i:16"> </span>
            <span style="--i:19"> </span>
            <span style="--i:19"> </span>
            <span style="--i:16"> </span>
            <span style="--i:16"> </span>
        </div>
     </div>
</body>
</html>
