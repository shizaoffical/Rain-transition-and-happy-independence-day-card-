<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background-color: white;
        }
        .head{
            text-align: center;
            color: white;
            background-color: green;
            height: 150px;
            width: 400px;
            margin-top: 200px;
        padding-top: 100px;
        border: 7px groove greenyellow;
        animation: hy 2s infinite;
        }
        @keyframes hy{
            40%{
                transform: rotateZ(30deg);
            }
        }
        .head:hover{
            background-color:blue;
        }
    </style>
    <center>
    <h1 class="head">**HAPPY <br>INDEPENDENCE  DAY**</h1>
</center>
</body>
